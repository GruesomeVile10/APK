name: Build Shizuku Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Project Directory
        run: |
          if [ -f "ShizukuPerfOverlay.zip" ]; then
            unzip -o ShizukuPerfOverlay.zip
          fi

          if [ -f "ShizukuPerfOverlay/settings.gradle.kts" ]; then
            cp -r ShizukuPerfOverlay/* .
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            mkdir -p app/src/main/aidl/com/example/shizukumonitor \
                     app/src/main/java/com/example/shizukumonitor

            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShizukuPerfOverlay"
          include(":app")
          EOF

            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.shizukumonitor"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.shizukumonitor"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { aidl = true }
          }
          dependencies {
              val shizukuVersion = "13.1.5"
              implementation("dev.rikka.shizuku:api:$shizukuVersion")
              implementation("dev.rikka.shizuku:provider:$shizukuVersion")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="Shizuku Perf Overlay"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Real-time hardware performance overlay" />
                  </service>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

            cat << 'EOF' > app/src/main/aidl/com/example/shizukumonitor/IMetricsService.aidl
          package com.example.shizukumonitor;
          interface IMetricsService {
              void destroy() = 16777114;
              float[] getMetrics();
          }
          EOF

            cat << 'EOF' > app/src/main/java/com/example/shizukumonitor/MetricsUserService.kt
          package com.example.shizukumonitor

          import android.os.SystemClock
          import androidx.annotation.Keep
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileReader
          import java.io.InputStreamReader
          import kotlin.system.exitProcess

          @Keep
          class MetricsUserService : IMetricsService.Stub() {
              private var prevCpuTotal = 0L
              private var prevCpuIdle = 0L
              private var prevFlipCount = -1L
              private var prevFlipTimeMs = 0L

              private val gpuPaths = listOf(
                  "/sys/class/kgsl/kgsl-3d0/gpubusy",
                  "/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage",
                  "/sys/kernel/gpu/gpu_busy",
                  "/sys/class/misc/mali0/device/utilization"
              )

              override fun destroy() { exitProcess(0) }

              override fun getMetrics(): FloatArray {
                  return floatArrayOf(readCpuUsage(), readGpuUsage(), readSurfaceFlingerFps())
              }

              private fun readCpuUsage(): Float {
                  try {
                      val file = File("/proc/stat")
                      if (file.canRead()) {
                          BufferedReader(FileReader(file)).use { reader ->
                              val line = reader.readLine() ?: return@use
                              if (line.startsWith("cpu ")) {
                                  val parts = line.trim().split("\\s+".toRegex())
                                  val user = parts[1].toLong()
                                  val nice = parts[2].toLong()
                                  val system = parts[3].toLong()
                                  val idle = parts[4].toLong()
                                  val iowait = parts.getOrNull(5)?.toLongOrNull() ?: 0L
                                  val irq = parts.getOrNull(6)?.toLongOrNull() ?: 0L
                                  val softirq = parts.getOrNull(7)?.toLongOrNull() ?: 0L
                                  val idleTime = idle + iowait
                                  val totalTime = user + nice + system + idleTime + irq + softirq
                                  val totalDelta = (totalTime - prevCpuTotal).coerceAtLeast(1L)
                                  val idleDelta = (idleTime - prevCpuIdle).coerceAtLeast(0L)
                                  prevCpuTotal = totalTime
                                  prevCpuIdle = idleTime
                                  return (((totalDelta - idleDelta).toFloat() / totalDelta) * 100f).coerceIn(0f, 100f)
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return readCpuFreqLoadFallback()
              }

              private fun readCpuFreqLoadFallback(): Float {
                  var totalRatio = 0f
                  var coreCount = 0
                  for (i in 0..15) {
                      val curFile = File("/sys/devices/system/cpu/cpu$i/cpufreq/scaling_cur_freq")
                      val maxFile = File("/sys/devices/system/cpu/cpu$i/cpufreq/cpuinfo_max_freq")
                      if (!curFile.exists() || !maxFile.exists()) break
                      try {
                          val cur = curFile.readText().trim().toFloat()
                          val max = maxFile.readText().trim().toFloat()
                          if (max > 0) { totalRatio += (cur / max); coreCount++ }
                      } catch (_: Exception) {}
                  }
                  return if (coreCount > 0) ((totalRatio / coreCount) * 100f).coerceIn(0f, 100f) else 0f
              }

              private fun readGpuUsage(): Float {
                  for (path in gpuPaths) {
                      try {
                          val file = File(path)
                          if (!file.canRead()) continue
                          val raw = file.readText().trim()
                          if (raw.isEmpty()) continue
                          val parts = raw.split("\\s+".toRegex())
                          if (parts.size >= 2) {
                              val busy = parts[0].toFloatOrNull() ?: 0f
                              val total = parts[1].toFloatOrNull() ?: 0f
                              return if (total > 0f) ((busy / total) * 100f).coerceIn(0f, 100f) else 0f
                          }
                          val cleaned = raw.replace("%", "").trim()
                          cleaned.toFloatOrNull()?.let { return it.coerceIn(0f, 100f) }
                      } catch (_: Exception) {}
                  }
                  return -1f
              }

              private fun readSurfaceFlingerFps(): Float {
                  try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", "service call SurfaceFlinger 1013"))
                      val output = BufferedReader(InputStreamReader(process.inputStream)).use { it.readText() }
                      process.waitFor()
                      val regex = Regex("""Parcel\(\s*[0-9a-fA-F]{8}\s+([0-9a-fA-F]{8})""")
                      val match = regex.find(output)
                      if (match != null) {
                          val currentFlips = match.groupValues[1].toLong(16)
                          val nowMs = SystemClock.elapsedRealtime()
                          if (prevFlipCount >= 0L && nowMs > prevFlipTimeMs) {
                              val deltaFlips = currentFlips - prevFlipCount
                              val deltaSeconds = (nowMs - prevFlipTimeMs) / 1000f
                              prevFlipCount = currentFlips
                              prevFlipTimeMs = nowMs
                              return (deltaFlips / deltaSeconds).coerceIn(0f, 240f)
                          }
                          prevFlipCount = currentFlips
                          prevFlipTimeMs = nowMs
                      }
                  } catch (_: Exception) {}
                  return 0f
              }
          }
          EOF

            cat << 'EOF' > app/src/main/java/com/example/shizukumonitor/OverlayService.kt
          package com.example.shizukumonitor

          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ComponentName
          import android.content.Intent
          import android.content.ServiceConnection
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import rikka.shizuku.Shizuku
          import java.util.Locale

          class OverlayService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var overlayTextView: TextView
              private var metricsService: IMetricsService? = null
              private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              private val userServiceArgs by lazy {
                  Shizuku.UserServiceArgs(ComponentName(packageName, MetricsUserService::class.java.name))
                      .daemon(false)
                      .processNameSuffix("metrics_daemon")
                      .debuggable(false)
                      .version(1)
              }

              private val shizukuConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      if (binder != null && binder.pingBinder()) {
                          metricsService = IMetricsService.Stub.asInterface(binder)
                          startPollingLoop()
                      }
                  }
                  override fun onServiceDisconnected(name: ComponentName?) { metricsService = null }
              }

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()
                  setupFloatingOverlay()
                  Shizuku.bindUserService(userServiceArgs, shizukuConnection)
              }

              private fun startForegroundNotification() {
                  val channelId = "overlay_perf_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Performance Overlay", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Shizuku Monitor Active")
                      .setContentText("Displaying real-time CPU, GPU, and FPS overlay")
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1001, notification)
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupFloatingOverlay() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  overlayTextView = TextView(this).apply {
                      text = "Connecting to Shizuku..."
                      setTextColor(Color.GREEN)
                      textSize = 12f
                      setBackgroundColor(Color.argb(180, 15, 15, 15))
                      setPadding(24, 16, 24, 16)
                  }
                  val layoutParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 32
                      y = 120
                  }
                  var initialX = 0; var initialY = 0; var initialTouchX = 0f; var initialTouchY = 0f
                  overlayTextView.setOnTouchListener { _: View, event: MotionEvent ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = layoutParams.x; initialY = layoutParams.y
                              initialTouchX = event.rawX; initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              layoutParams.x = initialX + (event.rawX - initialTouchX).toInt()
                              layoutParams.y = initialY + (event.rawY - initialTouchY).toInt()
                              windowManager.updateViewLayout(overlayTextView, layoutParams)
                              true
                          }
                          else -> false
                      }
                  }
                  windowManager.addView(overlayTextView, layoutParams)
              }

              private fun startPollingLoop() {
                  serviceScope.launch {
                      while (isActive) {
                          val stats = withContext(Dispatchers.IO) {
                              try { metricsService?.metrics } catch (_: Exception) { null }
                          }
                          if (stats != null && stats.size == 3) {
                              val cpuText = String.format(Locale.US, "%4.1f%%", stats[0])
                              val gpuText = if (stats[1] >= 0f) String.format(Locale.US, "%4.1f%%", stats[1]) else "N/A"
                              val fpsText = String.format(Locale.US, "%3.0f", stats[2])
                              overlayTextView.text = "FPS: $fpsText\nCPU: $cpuText\nGPU: $gpuText"
                          }
                          delay(750L)
                      }
                  }
              }

              override fun onDestroy() {
                  serviceScope.cancel()
                  try { Shizuku.unbindUserService(userServiceArgs, shizukuConnection, true) } catch (_: Exception) {}
                  if (::overlayTextView.isInitialized) { windowManager.removeView(overlayTextView) }
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

            cat << 'EOF' > app/src/main/java/com/example/shizukumonitor/MainActivity.kt
          package com.example.shizukumonitor

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import rikka.shizuku.Shizuku

          class MainActivity : AppCompatActivity() {
              private val shizukuPermissionCode = 101
              private val permissionListener = Shizuku.OnRequestPermissionResultListener { requestCode, grantResult ->
                  if (requestCode == shizukuPermissionCode && grantResult == PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Shizuku Permission Granted!", Toast.LENGTH_SHORT).show()
                      checkAndStartOverlay()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(permissionListener)
                  val startButton = Button(this).apply {
                      text = "Start Performance Overlay"
                      setOnClickListener { checkAndStartOverlay() }
                  }
                  val stopButton = Button(this).apply {
                      text = "Stop Overlay"
                      setOnClickListener { stopService(Intent(this@MainActivity, OverlayService::class.java)) }
                  }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(64, 64, 64, 64)
                      addView(startButton)
                      addView(stopButton)
                  }
                  setContentView(layout)
              }

              private fun checkAndStartOverlay() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      Toast.makeText(this, "Grant Overlay Permission first", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (!Shizuku.pingBinder()) {
                      Toast.makeText(this, "Shizuku is not running! Start Shizuku first.", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                      Shizuku.requestPermission(shizukuPermissionCode)
                      return
                  }
                  val serviceIntent = Intent(this, OverlayService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(serviceIntent)
                  else startService(serviceIntent)
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permissionListener)
                  super.onDestroy()
              }
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuPerfOverlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
